<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Do Wonder</title>
    <meta name="description"
        content="Experiencias que reconectan con el pasado, la comunidad, la memoria y la identidad.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>

<body>

    <header class="site-header">
        <div class="logo">
            <span class="logo-text">We Do Wonder</span>
        </div>
        <nav class="site-nav">
            <a href="#" class="nav-link icon-only" title="About">
                <i data-feather="info"></i>
            </a>
            <a href="#" class="nav-link icon-only" title="Facebook">
                <i data-feather="facebook"></i>
            </a>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-content fade-in-up">
                <h1 class="main-title">Inspiring Change in Vietnam through Education and Community.</h1>
                <p class="subtitle">
                    Founded in 2021, in Danang, Vietnam, <strong>We Do Wonder</strong> has directly impacted 100+ young
                    children, 50+ youth, and reaching over 100000 students through our initiatives and platform.
                </p>
            </div>
        </section>

        <section class="gallery-section">
            <!-- 5-column complex grid: Left(1), Stack(2), Center(1), Stack(2), Right(1) -->
            <div class="gallery-grid">
                <!-- Col 1: Vertical Portrait -->
                <div class="gallery-item item-tall-left">
                    <img src="images/cards.jpg" alt="Kid photo">
                </div>

                <!-- Col 2: Stack -->
                <div class="gallery-item item-stack-left-top">
                    <img src="images/home4(2).jpg" alt="Accordion player">
                </div>
                <div class="gallery-item item-stack-left-bottom">
                    <img src="images/street1.jpg" alt="Dancing/Street">
                </div>

                <!-- Col 3: Center Large -->
                <div class="gallery-item item-center-large">
                    <img src="images/home4(1).jpg" alt="Central cinematic shot">
                </div>

                <!-- Col 4: Stack -->
                <div class="gallery-item item-stack-right-top">
                    <img src="images/home4(4).jpg" alt="Building">
                </div>
                <div class="gallery-item item-stack-right-bottom">
                    <img src="images/home4(5).jpg" alt="Family group">
                </div>

                <!-- Col 5: Vertical Portrait -->
                <div class="gallery-item item-tall-right">
                    <img src="images/home4(7).jpg" alt="Women in white">
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        feather.replace();
    </script>
</body>

</html>
